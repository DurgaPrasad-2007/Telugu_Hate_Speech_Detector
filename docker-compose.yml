services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./models:/app/models:ro"]
    environment:
      - MODEL_DIR=/app/models/best
  streamlit:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    volumes: ["./models:/app/models:ro"]
    environment:
      - MODEL_DIR=/app/models/best
